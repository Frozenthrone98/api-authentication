server:
  port: 8080
spring:
  application:
    name: "authentication"
  devtools:
    add-properties: false
#  r2dbc:
#    url: r2dbc:postgresql://localhost:5432/users
#    username: postgre
#    password: postgre
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "users"
    schema: "public"
    username: "postgre"
    password: "postgre"
